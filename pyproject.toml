[project]
name = "robodojo"
version = "0.2.0"
description = "RoboDojo robot simulation benchmark (eval-only release)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{ name = "Yue Chen", email = "yuechen020614@gmail.com" }]
dependencies = [
    "click==8.1.7",
    "ffmpeg-python",
    "filelock==3.13.1",
    "h5py>=3.8",
    "huggingface-hub",
    "ipython<9",
    "isaaclab",
    "isaaclab-assets",
    "isaaclab-tasks",
    # Diagnostic fallback for hosts where the Isaac Sim 5.1 RTX path fails.
    "isaacsim[all,extscache]==5.0.0",
    "matplotlib",
    "msgpack>=1.0.8",
    "msgpack-numpy>=0.4.8",
    "numpy==1.26.0",
    "nvidia-curobo[cu12]",
    "omegaconf",
    "onnx>=1.18,<1.22",
    "open3d",
    "opencv-python-headless==4.11.0.86",
    "packaging==23.0",
    "pillow==11.2.1",
    "psutil==5.9.8",
    "pydantic>=2.5",
    "pyyaml>=6",
    "rtree",
    "scikit-learn",
    "scipy==1.15.3",
    "setuptools<81",
    "shapely",
    "starlette==0.45.3",
    "torch==2.7.0",
    "torchaudio==2.7.0",
    "torchvision==0.22.0",
    "transforms3d",
    "typing-extensions==4.12.2",
    "virtualenv==20.30.0",
    "warp-lang==1.11.0",
    "websockets==12.0",
    "wheel==0.45.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.11.7",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["env*", "src*", "task*", "utils*"]
exclude = ["third_party*", "XPolicyLab*"]

[tool.uv]
prerelease = "allow"
index-strategy = "unsafe-best-match"
constraint-dependencies = ["warp-lang != 1.13.0.dev20260418"]
override-dependencies = [
    "pillow==11.2.1",
    "starlette==0.45.3",
    # isaacsim-core 5.1 metadata incorrectly requests pywin32 on Linux.
    "pywin32==306; sys_platform == 'win32'",
]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.extra-build-dependencies]
flatdict = ["setuptools<81", "wheel"]
nvidia-curobo = ["setuptools>=45", "setuptools-scm>=6.2", "wheel"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
isaacsim = { index = "nvidia" }
isaaclab = { path = "third_party/IsaacLab/source/isaaclab", editable = true }
isaaclab-assets = { path = "third_party/IsaacLab/source/isaaclab_assets", editable = true }
isaaclab-tasks = { path = "third_party/IsaacLab/source/isaaclab_tasks", editable = true }
nvidia-curobo = { path = "third_party/curobo", editable = true }

[tool.ruff]
line-length = 120
target-version = "py311"

extend-exclude = [
    ".git",
    ".vscode",
    "eval_result",
    "third_party",
    "XPolicyLab",
    "Assets",
    "logs",
    "scripts/logs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]

ignore = [
    "E402",  # module-level import not at top (common in env bootstrap)
    "UP006", # Dict vs dict (legacy annotations in env/)
    "UP035", # typing.List/Dict — legacy annotations in env/
    "F403",  # legacy star imports (GLOBAL_CONFIGS, etc.) — migrate explicitly later
    "F405",  # symbols from star imports — migrate explicitly later
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/eval_client/main.py" = ["E402"]  # late first-party imports after AppLauncher bootstrap
"src/eval_client/eval_env.py" = ["E501"]
"env/**/*.py" = ["E501"]  # oversized modules; split in dedicated refactors
"task/**/*.py" = ["E501"]  # dense reward expressions; refactor with task helpers later
"utils/save_file.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["env", "task", "utils", "src"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
docstring-code-format = true
